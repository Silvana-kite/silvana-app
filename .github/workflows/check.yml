name: Check
on: [push, pull_request, workflow_dispatch]
jobs:
  workspace:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: siilvana
          POSTGRES_PASSWORD: siilvana_test
          POSTGRES_DB: siilvana_release_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U siilvana -d siilvana_release_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RELEASE_TEST_DATABASE_URL: postgresql://siilvana:siilvana_test@localhost:5432/siilvana_release_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --lib
      - run: cargo check --manifest-path desktop/src-tauri/Cargo.toml
