[package]
name = "siilvana-desktop"
version = "0.1.0"
description = "Developer environment initialization assistant"
edition = "2021"

[lib]
name = "siilvana_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
sysinfo = "0.39"
semver = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Threading", "Win32_System_SystemInformation"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
